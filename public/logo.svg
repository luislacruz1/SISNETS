  <line x1="70" y1="135" x2="100" y2="155" stroke="#06B6D4" stroke-width="3" stroke-dasharray="4 4" opacity="0.6"/>
  <line x1="130" y1="135" x2="100" y2="155" stroke="#06B6D4" stroke-width="3" stroke-dasharray="4 4" opacity="0.6"/>
  
  <circle cx="100" cy="50" r="7" fill="#06B6D4" />
  <circle cx="60" cy="75" r="6" fill="#3B82F6" />
